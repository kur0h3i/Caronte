[project]
name = "caronte"
version = "0.1.0"
description = "Explorador web de bases de datos relacionales (solo lectura)"
readme = "../README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "psycopg[binary]>=3.2",
    "pymysql[rsa]>=1.1",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=8.2",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "N", "C4", "PT"]
ignore = [
    "B008",   # Depends()/Query() en valores por defecto es el patrón de FastAPI
    "RUF001", # permitimos caracteres Unicode "ambiguos" en textos en español
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S608"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "integration: requiere las BDs de dev/docker-compose.yml (se salta si no están)",
]
