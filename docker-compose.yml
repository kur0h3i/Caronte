# Despliegue de Caronte en el servidor casero.
#   cp .env.example .env                           # y pon una contraseña
#   cp connections.example.toml connections.toml   # y define tus bases de datos
#   docker compose up -d --build
name: caronte

services:
  caronte:
    build: .
    image: caronte:latest
    restart: unless-stopped
    env_file: .env
    environment:
      CARONTE_CONFIG_FILE: /config/connections.toml
    ports:
      # Toda la LAN. Para exponerlo solo por Tailscale usa la IP del nodo:
      #   - "100.x.y.z:8000:8000"
      - "8000:8000"
    volumes:
      - ./connections.toml:/config/connections.toml:ro
      # Ficheros SQLite (rutas relativas del TOML se resuelven respecto a /config):
      # - /ruta/en/el/host/datos:/config/data:ro
    extra_hosts:
      # Para alcanzar BDs que escuchan en el propio servidor: host.docker.internal
      - "host.docker.internal:host-gateway"
    # Endurecimiento: sistema de ficheros de solo lectura y sin privilegios extra.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
