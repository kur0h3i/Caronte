# Despliegue de Caronte en el servidor casero.
#   cp .env.example .env                           # y pon una contraseña
#   cp connections.example.toml connections.toml   # y define tus bases de datos
#   docker compose up -d --build
# Si tus BDs están en localhost del servidor, activa docker-compose.host.yml desde .env
# (línea COMPOSE_FILE, ver .env.example) en vez de editar este fichero.
name: caronte

services:
  caronte:
    build: .
    image: caronte:latest
    restart: unless-stopped
    env_file: .env
    environment:
      CARONTE_CONFIG_FILE: /config/connections.toml
    ports:
      # El puerto se elige con CARONTE_PORT en .env (por defecto 8000). Toda la LAN;
      # para exponerlo solo por Tailscale antepón la IP del nodo: "100.x.y.z:${CARONTE_PORT:-8000}:..."
      - "${CARONTE_PORT:-8000}:${CARONTE_PORT:-8000}"
    volumes:
      - ./connections.toml:/config/connections.toml:ro
      # Ficheros SQLite (rutas relativas del TOML se resuelven respecto a /config):
      # - /ruta/en/el/host/datos:/config/data:ro
    extra_hosts:
      # Para alcanzar BDs que escuchan en el propio servidor: host.docker.internal
      - "host.docker.internal:host-gateway"
    # Endurecimiento: sistema de ficheros de solo lectura y sin privilegios extra.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
