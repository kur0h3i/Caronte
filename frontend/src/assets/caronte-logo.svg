<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Caronte">
  <title>Caronte</title>
  <defs>
    <radialGradient id="caronte-glow" cx="32" cy="26" r="30" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ef4444" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#ef4444" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="caronte-halo">
      <stop offset="0" stop-color="#fb923c" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#fb923c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="caronte-robe" x1="0" y1="7" x2="0" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6d28d9"/>
      <stop offset="1" stop-color="#2e1065"/>
    </linearGradient>
    <linearGradient id="caronte-rim" x1="0" y1="7" x2="0" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fb923c"/>
      <stop offset="1" stop-color="#b91c1c"/>
    </linearGradient>
    <linearGradient id="caronte-ember" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#fef08a"/>
      <stop offset="1" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="caronte-soul" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ede9fe"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <!-- Una llama, la misma que arde en Dis. -->
    <path id="caronte-flame" d="M5 0C6 4 10 7 10 12.5 10 17 7.5 20 5 20 2.5 20 0 17.5 0 13.5 0 10.5 2 9 2.5 6.5c1 2 2 2.5 2.3 1.5C5.3 6 5.2 3 5 0z"/>
  </defs>
  <rect width="64" height="64" rx="12" fill="#0a0a0a"/>
  <circle cx="32" cy="26" r="30" fill="url(#caronte-glow)"/>
  <!-- El barquero, encapuchado: «un vecchio, bianco per antico pelo» (Inf. III, 83). -->
  <path fill="url(#caronte-robe)" stroke="url(#caronte-rim)" stroke-width="1.1" stroke-linejoin="round"
        d="M24 6.5C21 9 15.5 12.5 15 19.5l-1.5 5L11 42h26l-2.5-17.5-1.5-5C32.5 12.5 27 9 24 6.5z"/>
  <path fill="#0a0a0a" d="M20 25v-6.5a4 4 0 0 1 8 0V25z"/>
  <!-- «Che 'ntorno a li occhi avea di fiamme rote» (v. 99): «occhi di bragia» (v. 109). -->
  <circle cx="22" cy="20" r="2.6" fill="url(#caronte-halo)"/>
  <circle cx="26" cy="20" r="2.6" fill="url(#caronte-halo)"/>
  <path fill="url(#caronte-ember)" d="M20.4 19 23.3 20.4 21.2 21.3zM27.6 19 24.7 20.4 26.8 21.3z"/>
  <path fill="#ede9fe" d="M20.5 24h7l-1.3 3.6L24 31.5l-2.2-3.9z"/>
  <!-- «Batte col remo qualunque s'adagia» (v. 111). -->
  <path stroke="url(#caronte-rim)" stroke-width="2.2" stroke-linecap="round" d="M43 9 12 57"/>
  <!-- Las almas que recoge (v. 110): aquí, las filas que trae de la base de datos. -->
  <use href="#caronte-flame" fill="url(#caronte-soul)" transform="translate(37.6 32.1) scale(0.42)"/>
  <use href="#caronte-flame" fill="url(#caronte-soul)" transform="translate(42.2 30.5) scale(0.5)"/>
  <use href="#caronte-flame" fill="url(#caronte-soul)" transform="translate(47.8 33.4) scale(0.36)"/>
  <!-- La barca, de hierro al rojo como las murallas de Dis. -->
  <path fill="url(#caronte-robe)" stroke="url(#caronte-rim)" stroke-width="1.2" stroke-linejoin="round"
        d="M5 40.5H50c2.6 0 4.8-1.8 6.3-5.3.6-.9 1.9-.5 1.7.6C56.5 44.5 52 51 44.5 51H17C11 51 7 46.5 5 40.5z"/>
  <!-- El Aqueronte, «la trista riviera» (v. 78). -->
  <path fill="none" stroke="#a78bfa" stroke-width="2.2" stroke-linecap="round" d="M7 55.5c3.2-2 6.3-2 9.5 0s6.3 2 9.5 0 6.3-2 9.5 0 6.3 2 9.5 0 6.3-2 9.5 0"/>
  <path fill="none" stroke="#a78bfa" stroke-width="2.2" stroke-linecap="round" stroke-opacity="0.55" d="M12 60.5c3.2-2 6.3-2 9.5 0s6.3 2 9.5 0 6.3-2 9.5 0 6.3 2 9.5 0"/>
</svg>
