<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Caronte">
  <title>Caronte</title>
  <defs>
    <radialGradient id="caronte-glow" cx="32" cy="28" r="30" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ef4444" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#ef4444" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="caronte-iron" x1="0" y1="6" x2="0" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6d28d9"/>
      <stop offset="1" stop-color="#2e1065"/>
    </linearGradient>
    <linearGradient id="caronte-rim" x1="0" y1="6" x2="0" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fb923c"/>
      <stop offset="1" stop-color="#b91c1c"/>
    </linearGradient>
    <linearGradient id="caronte-ember" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#fef08a"/>
      <stop offset="1" stop-color="#ea580c"/>
    </linearGradient>
  </defs>
  <!-- Fondo negro propio, como Dis y Cerbero: se ve igual sobre claro y oscuro. -->
  <rect width="64" height="64" rx="12" fill="#0a0a0a"/>
  <!-- El resplandor del Infierno, en la otra orilla. -->
  <circle cx="32" cy="28" r="30" fill="url(#caronte-glow)"/>
  <!-- La carga: una base de datos, de hierro al rojo como las murallas de Dis. -->
  <path fill="url(#caronte-iron)" stroke="url(#caronte-rim)" stroke-width="1.2" stroke-linejoin="round" d="M19 11v28h26V11"/>
  <path fill="none" stroke="url(#caronte-rim)" stroke-width="1.2" d="M19 19.5c0 2.5 5.8 4.5 13 4.5s13-2 13-4.5M19 28c0 2.5 5.8 4.5 13 4.5s13-2 13-4.5"/>
  <ellipse cx="32" cy="11" rx="13" ry="4.5" fill="#7c3aed" stroke="url(#caronte-rim)" stroke-width="1.2"/>
  <!-- «Per lo fioco lume» (Inf. III, 75): los datos, encendidos. -->
  <ellipse cx="32" cy="11" rx="7" ry="2" fill="url(#caronte-ember)" opacity="0.9"/>
  <!-- La barca: «ed ecco verso noi venir per nave» (Inf. III, 82). -->
  <path fill="url(#caronte-iron)" stroke="url(#caronte-rim)" stroke-width="1.2" stroke-linejoin="round" d="M3.5 32c1.5 10.5 9 18 19 18h19c10 0 17.5-7.5 19-18-4.5 4.5-10.5 7-17 7H20.5c-6.5 0-12.5-2.5-17-7z"/>
  <path fill="url(#caronte-rim)" d="M11 42.5q21 5.5 42 0l-1.4 2.6q-19.6 5-39.2 0z"/>
  <!-- El Aqueronte, «la trista riviera» (Inf. III, 78), en el lila de la Estigia de Dis. -->
  <path fill="none" stroke="#a78bfa" stroke-width="2.2" stroke-linecap="round" d="M7 55.5c3.2-2 6.3-2 9.5 0s6.3 2 9.5 0 6.3-2 9.5 0 6.3 2 9.5 0 6.3-2 9.5 0"/>
  <path fill="none" stroke="#a78bfa" stroke-width="2.2" stroke-linecap="round" stroke-opacity="0.55" d="M12 60.5c3.2-2 6.3-2 9.5 0s6.3 2 9.5 0 6.3-2 9.5 0 6.3 2 9.5 0"/>
</svg>
